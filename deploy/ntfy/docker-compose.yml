# «Бистро для двоих» — сервер уведомлений ntfy. Отдельный контейнер, ничего больше не трогает.
#
#   ./setup.sh                 # один раз: спросит адрес и пароль, создаст .env с секретами
#   docker compose up -d       # запустить ntfy на порту 7090
#   docker compose run --rm qr # напечатать QR → ../../qr/bistro-A6.pdf
#
# Все настройки и секреты — в .env (его нет в git). Пользователи, права и токен
# создаются самим ntfy при старте из переменных NTFY_AUTH_* — ручных команд не нужно.

services:
  ntfy:
    image: binwiederhier/ntfy:v2.25.0
    container_name: bistro-ntfy
    command: serve
    restart: unless-stopped
    ports:
      - "${NTFY_PORT:-7090}:80"
    environment:
      TZ: ${TZ:-Europe/Moscow}
      NTFY_BASE_URL: ${NTFY_BASE_URL:?запустите ./setup.sh}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      # хранилище сообщений: нужно для напоминания «завтра в 21:00», переживает перезапуск
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      # сервер закрыт: без логина или токена ничего нельзя
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      # ваш телефон — только чтение канала; страница (токен из QR) — только запись
      NTFY_AUTH_USERS: "${BISTRO_USER}:${BISTRO_USER_HASH}:user,bistro-page:${BISTRO_PAGE_HASH}:user"
      NTFY_AUTH_ACCESS: "${BISTRO_USER}:${BISTRO_TOPIC}:ro,bistro-page:${BISTRO_TOPIC}:wo"
      NTFY_AUTH_TOKENS: "bistro-page:${BISTRO_TOKEN}:qr-code"
      # мгновенная доставка на Android: через ntfy.sh идёт только сигнал «проверь сервер»
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      NTFY_WEB_ROOT: disable
    volumes:
      - ./data/cache:/var/cache/ntfy
      - ./data/lib:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Разовая задача: QR-наклейка из тех же настроек. Запуск: docker compose run --rm qr
  qr:
    profiles: ["tools"]
    image: python:3.12-slim
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      PIP_ROOT_USER_ACTION: ignore
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command:
      - sh
      - -c
      - >-
        pip install -q 'qrcode[pil]' &&
        python tools/make_qr.py --server '${NTFY_BASE_URL}' --topic '${BISTRO_TOPIC}'
        --token '${BISTRO_TOKEN}' ${BISTRO_DISCREET:+--discreet}
