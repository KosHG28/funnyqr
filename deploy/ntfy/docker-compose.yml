# ntfy для «Бистро для двоих» — отдельный контейнер, ничего больше не трогает.
# Запуск: docker compose up -d   (из этой папки)
services:
  ntfy:
    image: binwiederhier/ntfy:v2.25.0
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
    ports:
      - "7090:80"            # снаружи 7090 → внутри 80; reverse proxy смотрит на http://<сервер>:7090
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ./cache:/var/cache/ntfy   # сообщения, включая отложенные напоминания (переживают перезапуск)
      - ./lib:/var/lib/ntfy       # пользователи и токены
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
